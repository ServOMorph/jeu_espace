<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif" font-size="14">
  <rect width="900" height="500" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Vaisseau — vue de cote (L = 600px = 1.0 L)</text>

  <!-- axe -->
  <line x1="80" y1="250" x2="740" y2="250" stroke="#999" stroke-dasharray="6,4"/>

  <!-- fuselage : profil haut/bas -->
  <polyline points="100,232 190,202 310,184 460,196 610,208 700,208"
            fill="none" stroke="black" stroke-width="2"/>
  <polyline points="100,268 190,298 310,316 460,304 610,292 700,292"
            fill="none" stroke="black" stroke-width="2"/>
  <line x1="100" y1="232" x2="100" y2="268" stroke="black" stroke-width="2"/>
  <line x1="700" y1="208" x2="700" y2="292" stroke="black" stroke-width="2"/>

  <!-- coupole (ventrale / nadir, cf. proportions.md) -->
  <path d="M 340,306 Q 340,430 430,430 Q 520,430 520,306" fill="none" stroke="black" stroke-width="2"/>
  <line x1="340" y1="306" x2="520" y2="306" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- armature (montants schematiques) -->
  <line x1="370" y1="313" x2="390" y2="410" stroke="black" stroke-width="1"/>
  <line x1="430" y1="316" x2="430" y2="430" stroke="black" stroke-width="1"/>
  <line x1="490" y1="313" x2="470" y2="410" stroke="black" stroke-width="1"/>
  <line x1="360" y1="355" x2="500" y2="355" stroke="black" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- cockpit : bracket -->
  <line x1="100" y1="330" x2="190" y2="330" stroke="black" stroke-width="1"/>
  <line x1="100" y1="322" x2="100" y2="338" stroke="black" stroke-width="1"/>
  <line x1="190" y1="322" x2="190" y2="338" stroke="black" stroke-width="1"/>
  <text x="145" y="350" text-anchor="middle">Cockpit</text>

  <!-- panneaux (vus par la tranche) -->
  <line x1="370" y1="185" x2="610" y2="203" stroke="black" stroke-width="3"/>
  <text x="490" y="175" text-anchor="middle">panneaux (chant)</text>

  <!-- antenne -->
  <line x1="640" y1="208" x2="640" y2="148" stroke="black" stroke-width="1"/>
  <text x="655" y="150" text-anchor="start">antennes (x2)</text>

  <!-- nacelle moteur -->
  <circle cx="655" cy="250" r="24" fill="none" stroke="black" stroke-width="2"/>
  <text x="655" y="290" text-anchor="middle">nacelle (x2)</text>

  <!-- cotations -->
  <line x1="100" y1="420" x2="700" y2="420" stroke="black" stroke-width="1"/>
  <line x1="100" y1="414" x2="100" y2="426" stroke="black" stroke-width="1"/>
  <line x1="700" y1="414" x2="700" y2="426" stroke="black" stroke-width="1"/>
  <text x="400" y="440" text-anchor="middle">Longueur totale L = 1.0</text>

  <line x1="750" y1="250" x2="750" y2="430" stroke="black" stroke-width="1"/>
  <line x1="744" y1="250" x2="756" y2="250" stroke="black" stroke-width="1"/>
  <line x1="744" y1="430" x2="756" y2="430" stroke="black" stroke-width="1"/>
  <text x="770" y="335" text-anchor="middle" transform="rotate(90 770,335)">Coupole 0.30 L</text>
</svg>
