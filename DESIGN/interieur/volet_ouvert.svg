<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif" font-size="14">
  <rect width="900" height="500" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Volet blindé — état ouvert (vue depuis l'interieur, regard vers le sommet)</text>

  <!-- 3 cerclages concentriques -->
  <circle cx="450" cy="270" r="40" fill="none" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="450" cy="270" r="130" fill="none" stroke="black" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="450" cy="270" r="220" fill="none" stroke="black" stroke-width="2"/>

  <!-- baies vides : coque et espace visibles entre les montants -->
  <g fill="#EAF2F5" stroke="none">
    <path d="M 450,270 L 670,270 A 220,220 0 0 0 640,161 Z"/>
    <path d="M 450,270 L 640,161 A 220,220 0 0 0 559,105 Z"/>
    <path d="M 450,270 L 559,105 A 220,220 0 0 0 450,50 Z"/>
    <path d="M 450,270 L 450,50 A 220,220 0 0 0 341,105 Z"/>
    <path d="M 450,270 L 341,105 A 220,220 0 0 0 260,161 Z"/>
    <path d="M 450,270 L 260,161 A 220,220 0 0 0 230,270 Z"/>
    <path d="M 450,270 L 230,270 A 220,220 0 0 0 260,379 Z"/>
    <path d="M 450,270 L 260,379 A 220,220 0 0 0 341,435 Z"/>
    <path d="M 450,270 L 341,435 A 220,220 0 0 0 450,490 Z"/>
    <path d="M 450,270 L 450,490 A 220,220 0 0 0 559,435 Z"/>
    <path d="M 450,270 L 559,435 A 220,220 0 0 0 640,379 Z"/>
    <path d="M 450,270 L 640,379 A 220,220 0 0 0 670,270 Z"/>
  </g>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#557">coque + espace visibles entre montants</text>

  <!-- montants seuls, plus de panneaux -->
  <g stroke="black" stroke-width="2">
    <line x1="450" y1="270" x2="670" y2="270"/>
    <line x1="450" y1="270" x2="640" y2="161"/>
    <line x1="450" y1="270" x2="559" y2="105"/>
    <line x1="450" y1="270" x2="450" y2="50"/>
    <line x1="450" y1="270" x2="341" y2="105"/>
    <line x1="450" y1="270" x2="260" y2="161"/>
    <line x1="450" y1="270" x2="230" y2="270"/>
    <line x1="450" y1="270" x2="260" y2="379"/>
    <line x1="450" y1="270" x2="341" y2="435"/>
    <line x1="450" y1="270" x2="450" y2="490"/>
    <line x1="450" y1="270" x2="559" y2="435"/>
    <line x1="450" y1="270" x2="640" y2="379"/>
  </g>

  <!-- anneau de logement des panneaux retractes, en peripherie exterieure (base) -->
  <circle cx="450" cy="270" r="220" fill="none" stroke="#33383E" stroke-width="10"/>
  <text x="750" y="270" text-anchor="start" font-size="12">anneau de base — les 12 panneaux</text>
  <text x="750" y="286" text-anchor="start" font-size="12">retractes s'y empilent (translation radiale)</text>

  <text x="450" y="465" text-anchor="middle" font-size="12">Panneaux retires vers l'anneau de base — baies degagees, armature seule visible</text>
</svg>
